name: Update Google Scholar Stats

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: true

jobs:
  update-google-scholar-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: google_scholar_crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r google_scholar_crawler/requirements.txt

      - name: Fetch Google Scholar stats
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        run: |
          if [ -z "${GOOGLE_SCHOLAR_ID}" ]; then
            echo "GOOGLE_SCHOLAR_ID secret is not set."
            exit 1
          fi

          python google_scholar_crawler/main.py

      - name: Publish stats to google-scholar-stats branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cd google_scholar_crawler/results

          git init
          git checkout -b google-scholar-stats
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json

          if git diff --cached --quiet; then
            echo "No Google Scholar stats changes to publish."
            exit 0
          fi

          git commit -m "Update Google Scholar stats"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin google-scholar-stats
